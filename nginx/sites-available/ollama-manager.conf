# =============================================================================
# Ollama Manager - HTTP Virtual Host Configuration
# Reverse Proxy for Frontend (React/Vite) and Backend (FastAPI)
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost ollama-manager.local _;

    # Access & Error Logs
    access_log /var/log/nginx/ollama-manager.access.log main;
    error_log /var/log/nginx/ollama-manager.error.log warn;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------
    # Root Location - Frontend (React/Vite)
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_server;
        proxy_http_version 1.1;
        
        # WebSocket Support (for Vite HMR in development)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering off;
        proxy_cache off;
    }

    # ---------------------------------------------------------------------
    # API Routes - Backend (FastAPI)
    # ---------------------------------------------------------------------
    location /api/ {
        # Rate Limiting
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        # Rewrite /api prefix and proxy to backend
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        
        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Connection Header for keepalive
        proxy_set_header Connection "";
        
        # Timeouts (longer for AI model operations)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ---------------------------------------------------------------------
    # Authentication Endpoints (Stricter Rate Limiting)
    # ---------------------------------------------------------------------
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_conn conn_limit 5;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ---------------------------------------------------------------------
    # Streaming Endpoints (SSE/EventSource)
    # ---------------------------------------------------------------------
    location ~ ^/api/run/(stream|chat/stream)$ {
        limit_req zone=api_limit burst=10 nodelay;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # SSE specific settings
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        
        # Long timeouts for streaming
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # ---------------------------------------------------------------------
    # API Documentation
    # ---------------------------------------------------------------------
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---------------------------------------------------------------------
    # Health Check Endpoint
    # ---------------------------------------------------------------------
    location /health {
        access_log off;
        proxy_pass http://backend_server/system/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ---------------------------------------------------------------------
    # Static Files Caching (Production)
    # ---------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        
        # Cache static files
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------------------------------------------------------------------
    # Deny Access to Hidden Files
    # ---------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
